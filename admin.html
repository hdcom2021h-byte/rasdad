<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة طلبات رصداد</title><style>body{font-family:Arial,sans-serif;max-width:1100px;margin:40px auto;padding:20px;background:#f3f8f5;color:#12324a}input,button,select{padding:12px;border:1px solid #bdcec5;border-radius:8px;font:inherit}button{background:#0f3d3e;color:white;cursor:pointer}article{background:white;padding:24px;border-radius:16px;margin:16px 0;overflow-wrap:anywhere}dd{white-space:pre-wrap;margin-bottom:16px}dt{font-weight:bold}form{display:flex;gap:12px;flex-wrap:wrap}input{max-width:100%;box-sizing:border-box}a{color:#0e8b6a}</style></head><body><a href="index.html">← العودة للموقع</a><h1>الاستفسارات والطلبات</h1><p>هذه البيانات خاصة بإدارة رصداد.</p><form id="login"><label>مفتاح الإدارة <input type="password" id="key" required autocomplete="current-password"></label><button>عرض البيانات</button></form><p role="status" id="status"></p><div id="panel" hidden><label>عرض <select id="filter"><option value="all">الكل</option><option value="inquiry">الاستفسارات</option><option value="request">الطلبات</option></select></label> <button id="logout">إغلاق البيانات</button><p id="counts"></p><div id="leads"></div></div><script>
let leads=[];
const labels={name:'الاسم',phone:'الجوال',email:'البريد',entity:'الجهة',type:'نوع المشروع',date:'موعد التنفيذ',description:'وصف الطلب',features:'الخصائص',message:'الاستفسار'};
function render(){const target=document.getElementById('leads');target.replaceChildren();document.getElementById('counts').textContent=`الطلبات: ${leads.filter(x=>x.kind==='request').length} — الاستفسارات: ${leads.filter(x=>x.kind==='inquiry').length}`;const rows=leads.filter(x=>filter.value==='all'||x.kind===filter.value);if(!rows.length)target.textContent='لا توجد بيانات لعرضها.';rows.forEach(row=>{const card=document.createElement('article'),title=document.createElement('h2'),details=document.createElement('dl');title.textContent=`${row.kind==='request'?'طلب':'استفسار'} #${row.id} — ${new Date(row.created).toLocaleString('ar-SA')}`;Object.entries(labels).forEach(([key,label])=>{if(!row.data[key])return;const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=row.data[key];details.append(dt,dd);});card.append(title,details);target.append(card);});}
const filter=document.getElementById('filter');filter.addEventListener('change',render);
document.getElementById('login').addEventListener('submit',async event=>{event.preventDefault();const status=document.getElementById('status');try{const response=await fetch('/api/admin',{headers:{Authorization:'Bearer '+document.getElementById('key').value},cache:'no-store'});if(!response.ok)throw new Error();leads=(await response.json()).leads;document.getElementById('panel').hidden=false;document.getElementById('key').value='';status.textContent='تم تحميل البيانات.';render();}catch{leads=[];document.getElementById('panel').hidden=true;document.getElementById('leads').replaceChildren();status.textContent='تعذر الوصول. تحقق من مفتاح الإدارة واتصال الخادم.';}});
document.getElementById('logout').addEventListener('click',()=>{leads=[];document.getElementById('leads').replaceChildren();document.getElementById('panel').hidden=true;document.getElementById('status').textContent='تم إغلاق البيانات.';});
</script></body></html>
