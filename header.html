<style>
    :root {
        --rasdad-primary: #0F3D3E;
        --rasdad-secondary: #0E8B6A;
        --rasdad-mint: #A7D7C6;
        --rasdad-lavender: #C8B4F6;
        --rasdad-cream: #EDE9E3;

        --rasdad-white: #FFFFFF;

        --text-heading: #12324A;
        --text-primary: #344054;
        --text-secondary: #667085;

        --border-color: #E4EAE7;

        --header-shadow:
            0 10px 35px rgba(15, 61, 62, 0.07);
    }

    /* ========================================
       HEADER
    ======================================== */

    .site-header {
        position: fixed;

        top: 0;
        right: 0;
        left: 0;

        z-index: 9999;

        background:
            rgba(248, 250, 249, 0.76);

        border-bottom:
            1px solid transparent;

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        transition:
            background 0.3s ease,
            border-color 0.3s ease,
            box-shadow 0.3s ease;
    }

    .site-header.is-scrolled {
        background:
            rgba(255, 255, 255, 0.97);

        border-bottom-color:
            var(--border-color);

        box-shadow:
            var(--header-shadow);
    }

    .header-container {
        width:
            min(1200px, calc(100% - 32px));

        min-height: 86px;

        margin-inline: auto;

        display: flex;

        align-items: center;

        justify-content: space-between;

        gap: 22px;
    }

    /* ========================================
       BRAND
    ======================================== */

    .brand {
        flex-shrink: 0;

        display: inline-flex;

        align-items: center;

        gap: 12px;

        text-decoration: none;

        min-width: max-content;
    }

    /* الدائرة الخارجية للشعار */

    .brand-logo-shell {
        width: 62px;
        height: 62px;

        flex: 0 0 62px;

        position: relative;

        display: grid;

        place-items: center;

        border-radius: 50%;

        padding: 4px;

        background:
            linear-gradient(
                145deg,
                rgba(167, 215, 198, 0.92),
                rgba(255, 255, 255, 0.96),
                rgba(200, 180, 246, 0.70)
            );

        box-shadow:
            0 9px 25px rgba(15, 61, 62, 0.15),
            0 0 0 1px rgba(15, 61, 62, 0.06);

        transition:
            transform 0.25s ease,
            box-shadow 0.25s ease;
    }

    .brand:hover .brand-logo-shell {
        transform:
            translateY(-2px)
            scale(1.03);

        box-shadow:
            0 13px 30px rgba(15, 61, 62, 0.20),
            0 0 0 1px rgba(14, 139, 106, 0.10);
    }

    /* لمعة خلفية بسيطة */

    .brand-logo-shell::before {
        content: "";

        position: absolute;

        inset: -4px;

        border-radius: inherit;

        background:
            radial-gradient(
                circle at 30% 20%,
                rgba(167, 215, 198, 0.35),
                transparent 55%
            );

        z-index: -1;

        opacity: 0;

        transition:
            opacity 0.25s ease;
    }

    .brand:hover
    .brand-logo-shell::before {
        opacity: 1;
    }

    /* الصورة نفسها */

    .brand-logo-image {
        width: 100%;
        height: 100%;

        display: block;

        object-fit: contain;

        object-position: center;

        border-radius: 50%;

        background: #FFFFFF;

        padding: 2px;
    }

    /* ========================================
       BRAND TEXT
    ======================================== */

    .brand-content {
        line-height: 1;
    }

    .brand-content strong {
        display: block;

        color:
            var(--rasdad-primary);

        font-size: 25px;

        font-weight: 800;

        letter-spacing: -0.5px;
    }

    .brand-content small {
        display: block;

        margin-top: 7px;

        color:
            var(--text-secondary);

        font-family:
            "Inter",
            Arial,
            sans-serif;

        font-size: 9px;

        font-weight: 600;

        letter-spacing: 5px;
    }

    /* ========================================
       NAVIGATION
    ======================================== */

    .main-nav {
        flex: 1;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 2px;
    }

    .main-nav a {
        position: relative;

        padding:
            10px 10px;

        border-radius: 10px;

        color:
            var(--text-primary);

        font-size: 14px;

        font-weight: 600;

        text-decoration: none;

        white-space: nowrap;

        transition:
            color 0.22s ease,
            background 0.22s ease;
    }

    .main-nav a:hover,
    .main-nav a.active {
        color:
            var(--rasdad-secondary);

        background:
            rgba(14, 139, 106, 0.07);
    }

    .main-nav a::after {
        content: "";

        position: absolute;

        right: 50%;
        bottom: 2px;

        width: 0;
        height: 2px;

        transform:
            translateX(50%);

        border-radius: 100px;

        background:
            var(--rasdad-secondary);

        transition:
            width 0.22s ease;
    }

    .main-nav a:hover::after,
    .main-nav a.active::after {
        width: 22px;
    }

    /* ========================================
       HEADER ACTIONS
    ======================================== */

    .header-actions {
        display: flex;

        align-items: center;

        gap: 9px;

        flex-shrink: 0;
    }

    .header-cta {
        min-height: 45px;

        padding-inline: 19px;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        gap: 7px;

        border-radius: 12px;

        color: #FFFFFF;

        text-decoration: none;

        font-size: 13px;

        font-weight: 700;

        background:
            linear-gradient(
                135deg,
                var(--rasdad-primary),
                var(--rasdad-secondary)
            );

        box-shadow:
            0 9px 24px
            rgba(14, 139, 106, 0.18);

        transition:
            transform 0.22s ease,
            box-shadow 0.22s ease;
    }

    .header-cta:hover {
        transform:
            translateY(-2px);

        box-shadow:
            0 14px 30px
            rgba(14, 139, 106, 0.25);
    }

    .header-cta-arrow {
        font-size: 15px;

        transition:
            transform 0.2s ease;
    }

    .header-cta:hover
    .header-cta-arrow {
        transform:
            translateX(-3px);
    }

    /* ========================================
       MOBILE MENU BUTTON
    ======================================== */

    .menu-toggle {
        width: 45px;
        height: 45px;

        border:
            1px solid
            var(--border-color);

        border-radius: 12px;

        background: #FFFFFF;

        color:
            var(--rasdad-primary);

        display: none;

        align-items: center;

        justify-content: center;

        cursor: pointer;

        transition:
            background 0.2s ease,
            border-color 0.2s ease,
            box-shadow 0.2s ease;
    }

    .menu-toggle:hover {
        border-color:
            var(--rasdad-mint);

        background:
            #F8FBFA;

        box-shadow:
            0 7px 18px
            rgba(15, 61, 62, 0.08);
    }

    .menu-lines {
        width: 21px;
        height: 15px;

        position: relative;
    }

    .menu-lines span {
        position: absolute;

        right: 0;

        width: 21px;

        height: 2px;

        border-radius: 10px;

        background:
            currentColor;

        transition:
            top 0.25s ease,
            transform 0.25s ease,
            opacity 0.25s ease;
    }

    .menu-lines span:nth-child(1) {
        top: 0;
    }

    .menu-lines span:nth-child(2) {
        top: 6.5px;
    }

    .menu-lines span:nth-child(3) {
        top: 13px;
    }

    .menu-toggle.open
    .menu-lines span:nth-child(1) {
        top: 6.5px;

        transform:
            rotate(45deg);
    }

    .menu-toggle.open
    .menu-lines span:nth-child(2) {
        opacity: 0;
    }

    .menu-toggle.open
    .menu-lines span:nth-child(3) {
        top: 6.5px;

        transform:
            rotate(-45deg);
    }

    /* ========================================
       RESPONSIVE
    ======================================== */

    @media (max-width: 1100px) {

        .main-nav {
            position: absolute;

            top:
                calc(100% + 8px);

            right: 16px;
            left: 16px;

            padding: 12px;

            display: none;

            flex-direction: column;

            align-items: stretch;

            gap: 3px;

            border:
                1px solid
                var(--border-color);

            border-radius: 18px;

            background:
                rgba(255, 255, 255, 0.98);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            box-shadow:
                0 22px 50px
                rgba(15, 61, 62, 0.14);
        }

        .main-nav.open {
            display: flex;
        }

        .main-nav a {
            width: 100%;

            padding:
                13px 15px;
        }

        .main-nav a::after {
            display: none;
        }

        .menu-toggle {
            display: flex;
        }
    }

    @media (max-width: 650px) {

        .header-container {
            width:
                min(100% - 22px, 1200px);

            min-height: 74px;

            gap: 10px;
        }

        .brand {
            gap: 9px;
        }

        .brand-logo-shell {
            width: 52px;
            height: 52px;

            flex-basis: 52px;

            padding: 3px;
        }

        .brand-content strong {
            font-size: 21px;
        }

        .brand-content small {
            margin-top: 5px;

            font-size: 7px;

            letter-spacing: 4px;
        }

        .header-cta {
            display: none;
        }

        .main-nav {
            right: 11px;
            left: 11px;
        }
    }

    @media (max-width: 390px) {

        .brand-logo-shell {
            width: 47px;
            height: 47px;

            flex-basis: 47px;
        }

        .brand-content strong {
            font-size: 19px;
        }

        .brand-content small {
            letter-spacing: 3px;
        }
    }

    @media (
        prefers-reduced-motion: reduce
    ) {

        .brand-logo-shell,
        .header-cta,
        .menu-lines span,
        .main-nav a {
            transition: none;
        }
    }
    .pricing-menu { position: relative; }
    .pricing-menu summary {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px;
        border-radius: 10px;
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        list-style: none;
    }
    .pricing-menu summary::-webkit-details-marker { display: none; }
    .pricing-menu[open] summary {
        color: var(--rasdad-secondary);
        background: rgba(14, 139, 106, 0.07);
    }
    .pricing-submenu {
        position: absolute;
        top: calc(100% + 8px);
        inset-inline-start: 0;
        min-width: 175px;
        padding: 8px;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        background: #FFFFFF;
        box-shadow: var(--header-shadow);
    }
    .pricing-submenu a { display: block; }
    @media (max-width: 1100px) {
        .pricing-menu summary { padding: 13px 15px; }
        .pricing-submenu {
            position: static;
            margin: 4px 15px;
            min-width: 0;
            box-shadow: none;
        }
    }
</style>


<header
    class="site-header"
    id="siteHeader"
>

    <div class="header-container">

        <!-- ========================
             LOGO / BRAND
        ======================== -->

        <a
            href="#home"
            class="brand"
            aria-label="رصداد - العودة إلى الصفحة الرئيسية"
        >

            <div class="brand-logo-shell">

                <img
                    src="media/logo.png"
                    alt="شعار رصداد RASDAD"
                    class="brand-logo-image"
                    width="60"
                    height="60"
                    loading="eager"
                    decoding="async"
                    onerror="
                        this.style.display='none';
                        this.parentElement.innerHTML=
                        '<strong style=&quot;color:#0F3D3E;font-size:12px;&quot;>رصداد</strong>';
                    "
                >

            </div>

            <div class="brand-content">

                <strong>
                    رصداد
                </strong>

                <small>
                    RASDAD
                </small>

            </div>

        </a>


        <!-- ========================
             NAVIGATION
        ======================== -->

        <nav
            class="main-nav"
            id="mainNav"
            aria-label="القائمة الرئيسية"
        >

            <a
                href="#home"
                class="active"
            >
                الرئيسية
            </a>

            <a href="#solutions">
                من نحن
            </a>

            <a href="services.html">خدماتنا</a>

            <a href="#sectors">
                القطاعات
            </a>

            <a href="#portfolio">
                أعمالنا
            </a>

            <a href="#process">
                كيف نعمل
            </a>

            <details class="pricing-menu">
                <summary>الأسعار <span aria-hidden="true">⌄</span></summary>
                <div class="pricing-submenu">
                    <a href="packages.html">الباقات</a>
                    <a href="#pricing">طلب مخصص</a>
                    <a href="#project-request">طلب تصميم جديد</a>
                </div>
            </details>

            <a href="#faq">
                الأسئلة الشائعة
            </a>

            <a href="#contact">
                اتصل بنا
            </a>

        </nav>


        <!-- ========================
             ACTIONS
        ======================== -->

        <div class="header-actions">

            <a
                href="#project-request"
                class="header-cta"
            >

                <span>
                    اطلب داشبورد
                </span>

                <span
                    class="header-cta-arrow"
                    aria-hidden="true"
                >
                    ←
                </span>

            </a>


            <button
                type="button"
                class="menu-toggle"
                id="menuToggle"
                aria-label="فتح القائمة"
                aria-controls="mainNav"
                aria-expanded="false"
            >

                <span
                    class="menu-lines"
                    aria-hidden="true"
                >
                    <span></span>
                    <span></span>
                    <span></span>
                </span>

            </button>

        </div>

    </div>

</header>


<script>
(() => {

    "use strict";


    const header =
        document.getElementById(
            "siteHeader"
        );


    const nav =
        document.getElementById(
            "mainNav"
        );


    const toggle =
        document.getElementById(
            "menuToggle"
        );


    if (
        !header ||
        !nav ||
        !toggle
    ) {
        return;
    }


    /* ========================================
       HEADER SCROLL EFFECT
    ======================================== */

    const updateHeader =
        () => {

            header.classList.toggle(
                "is-scrolled",
                window.scrollY > 18
            );

        };


    updateHeader();


    window.addEventListener(
        "scroll",
        updateHeader,
        {
            passive: true
        }
    );


    /* ========================================
       MOBILE MENU
    ======================================== */

    const pricingMenu = nav.querySelector(".pricing-menu");

    document.addEventListener("click", event => {
        if (!pricingMenu.contains(event.target)) pricingMenu.open = false;
    });

    document.addEventListener("keydown", event => {
        if (event.key === "Escape" && pricingMenu.open) {
            pricingMenu.open = false;
            pricingMenu.querySelector("summary").focus();
        }
    });

    const closeMenu =
        () => {

            pricingMenu.open = false;

            nav.classList.remove(
                "open"
            );

            toggle.classList.remove(
                "open"
            );

            toggle.setAttribute(
                "aria-expanded",
                "false"
            );

        };


    toggle.addEventListener(
        "click",
        () => {

            const opened =
                nav.classList.toggle(
                    "open"
                );


            toggle.classList.toggle(
                "open",
                opened
            );


            toggle.setAttribute(
                "aria-expanded",
                String(opened)
            );

        }
    );


    nav.querySelectorAll(
        "a"
    ).forEach(
        link => {

            link.addEventListener(
                "click",
                closeMenu
            );

        }
    );


    document.addEventListener(
        "click",
        event => {

            if (
                window.innerWidth > 1100
            ) {
                return;
            }


            if (
                header.contains(
                    event.target
                )
            ) {
                return;
            }


            closeMenu();

        }
    );


    window.addEventListener(
        "resize",
        () => {

            if (
                window.innerWidth > 1100
            ) {
                closeMenu();
            }

        }
    );


    /* ========================================
       ACTIVE NAVIGATION
    ======================================== */

    function alignDestination(hash, behavior = "smooth") {
        const target = document.getElementById(hash.slice(1));
        if (!target) return;
        const headerHeight = header.getBoundingClientRect().height;
        const availableHeight = window.innerHeight - headerHeight;
        target.classList.add("visible");
        const rect = target.getBoundingClientRect();
        const padding = parseFloat(getComputedStyle(target).paddingTop) || 0;
        const offset = rect.height <= availableHeight
            ? headerHeight + (availableHeight - rect.height) / 2
            : headerHeight + 20 - padding;
        window.scrollTo({
            top: Math.max(0, window.scrollY + rect.top - offset),
            behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : behavior
        });
    }

    document.addEventListener("click", event => {
        const link = event.target.closest("a[href]");
        if (!link || event.defaultPrevented || event.button !== 0 || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey || link.target === "_blank") return;
        const url = new URL(link.href, location.href);
        if (url.origin !== location.origin || url.pathname !== location.pathname || !url.hash || !document.getElementById(url.hash.slice(1))) return;
        event.preventDefault();
        closeMenu();
        if (location.hash !== url.hash) history.pushState(null, "", url.hash);
        alignDestination(url.hash);
    });

    window.addEventListener("hashchange", () => alignDestination(location.hash));
    if (location.hash) {
        requestAnimationFrame(() => requestAnimationFrame(() => alignDestination(location.hash, "auto")));
    }

    const navigationLinks =
        [
            ...nav.querySelectorAll(
                'a[href^="#"]'
            )
        ];


    const sections =
        navigationLinks
            .map(
                link => {

                    const selector =
                        link.getAttribute(
                            "href"
                        );


                    try {

                        return document.querySelector(
                            selector
                        );

                    } catch {

                        return null;

                    }

                }
            )
            .filter(Boolean);


    if (
        "IntersectionObserver" in window &&
        sections.length
    ) {

        const observer =
            new IntersectionObserver(
                entries => {

                    entries.forEach(
                        entry => {

                            if (
                                !entry.isIntersecting
                            ) {
                                return;
                            }


                            navigationLinks
                                .forEach(
                                    link => {

                                        const active =
                                            link.getAttribute(
                                                "href"
                                            ) ===
                                            "#" +
                                            entry.target.id;


                                        link.classList.toggle(
                                            "active",
                                            active
                                        );

                                    }
                                );

                        }
                    );

                },
                {
                    rootMargin:
                        "-38% 0px -52% 0px",

                    threshold:
                        0.01
                }
            );


        sections.forEach(
            section => {

                observer.observe(
                    section
                );

            }
        );

    }

})();
</script>
